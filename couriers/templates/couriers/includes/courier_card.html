<article class="card courier-card">
    <div class="card-body d-flex justify-content-between align-items-center">
        <div>
            <h2 class="h5 card-title mb-1">{{ courier.name|default:"Без имени" }}</h2>
            <p class="card-text text-muted mb-0">{{ courier.type|capfirst }}</p>
        </div>
        <div class="text-end">
            {% include "couriers/includes/courier_busy.html" %}
            <a href="{% url 'couriers:courier_detail' courier.id %}" class="btn btn-sm btn-outline-primary ms-2">Подробнее</a>
        </div>
    </div>
</article>
